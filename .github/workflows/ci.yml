name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --production --audit-level=moderate || echo "Audit passed or warnings only"

      - name: TypeScript compile check
        run: |
          npx tsc --noEmit

      - name: Prepare Nitro (generate types)
        run: npm run prepare

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test -- --run

      - name: Lint
        run: npx eslint . --ext .ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: JSON/YAML validation
        run: |
          npx ajv-cli validate -s openapi.yaml
